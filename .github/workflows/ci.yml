# The same gate as local (ADR 0008): `pnpm verify` on every PR and every push to main. Under
# CI the format and i18n stages only check (scripts/verify.ts), and the gate runs on a virtual
# display for its desktop smoke stage. Branch protection on main requires
# this job (AGENTS.md, "Pull Requests").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR supersedes its running check; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The migrations stage compares with the merge base with main, and fails without it.
          fetch-depth: 0
      # pnpm from `packageManager`, Node from `engines.node`, both in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With Ubuntu's system libraries, which the `stories` stage's own call does not ask for.
      - run: node scripts/ensure-chromium.ts --with-deps
      # The smoke stage starts the desktop app. Ubuntu 24.04's AppArmor forbids the user
      # namespaces of Chromium's sandbox, and Electron's setuid fallback is not set up, so
      # Electron would refuse to start; this lifts the restriction instead of turning the
      # app's sandbox off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runner has no display: xvfb-run gives Electron a virtual one. Installed only if the
      # runner image lacks it. The stage itself downloads the Electron binary.
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run --auto-servernum pnpm verify
