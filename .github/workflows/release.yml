# Publishes a nightly or stable release (ADR 0007) in this repository, from a commit the
# release plan picks (scripts/release-plan.ts). A release is built, then published: its `v*`
# tag only appears once the dmg is attached, and the tags are what the next plan reads. Stable
# therefore needs one published nightly first.
name: Release

on:
  # Every second night (odd days of the month, so the 31st and the 1st are both built). Off
  # unless the repository variable NIGHTLY_SCHEDULE_ENABLED is 'true' (see the plan job).
  schedule:
    - cron: "17 2 */2 * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: Stable version, for example 0.1.0. Empty proposes a patch bump.
        required: false
        type: string

permissions:
  contents: read

# Separate groups, so a nightly never holds up a stable; a publisher is never cancelled.
concurrency:
  group: release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    # Releases come from main only: stable ships what nightly already ran (ADR 0007). macOS
    # minutes on a private repository are limited, so the schedule is opt-in; by hand always works.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.NIGHTLY_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The plan reads every release tag; the changelog walks the history.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          REQUESTED_VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$CHANNEL" = nightly ]; then
            node scripts/release-plan.ts nightly --commit "$COMMIT" --started-at "$(date -u +%FT%TZ)" --run-number "$RUN_NUMBER"
          else
            node scripts/release-plan.ts stable --version "$REQUESTED_VERSION"
          fi
      - name: Write the changelog
        if: steps.plan.outputs.channel == 'stable'
        env:
          FROM: ${{ steps.plan.outputs.previous_tag }}
          TO: ${{ steps.plan.outputs.commit }}
        run: |
          node scripts/release-changelog.ts --from "$FROM" --to "$TO" --output release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the changelog
        if: steps.plan.outputs.channel == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build the desktop app
    needs: [plan]
    # A scheduled nightly only builds when main changed since the last one; by hand always builds.
    if: github.event_name != 'schedule' || needs.plan.outputs.changed == 'true'
    # Apple Silicon, the only architecture packaged so far.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          # Only this step sees the signing secrets. A missing one fails the packaging.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package:desktop "$CHANNEL" --release-version "$RELEASE_VERSION"
      - name: Keep the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}
          path: apps/desktop/release/${{ needs.plan.outputs.channel }}/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write, and it runs no code from the release commit or its packages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}
          path: release-assets
      - if: needs.plan.outputs.channel == 'stable'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/release-publish.ts --channel "$CHANNEL" --tag "$TAG" --commit "$COMMIT" --assets release-assets --changelog release-notes/release-notes.md
