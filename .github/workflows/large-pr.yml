# Labels a large pull request `large` (scripts/large-pr.ts says which is large). The label opts the
# pull request into CodeRabbit's automatic review (.coderabbit.yaml) and tells the agent that
# opens it to check the app before the merge (docs/agents/workflow.md, "Large pull requests").
# Not a required check: the label only ever gets added, never removed.
name: Large PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: large-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script needs no dependencies: Node 26 runs TypeScript directly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: List the changed files
        run: >-
          gh api --paginate "repos/$REPO/pulls/$PR/files"
          --jq '.[] | {filename, additions, deletions}' > "$RUNNER_TEMP/files.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
      - id: size
        run: node scripts/large-pr.ts
        env:
          PR_FILES: ${{ runner.temp }}/files.jsonl
      - name: Label the pull request
        if: steps.size.outputs.large == 'true'
        run: gh pr edit "$PR" --repo "$REPO" --add-label large
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
