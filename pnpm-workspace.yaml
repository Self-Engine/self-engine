packages:
  - apps/*
  - packages/*

# Refuse installs on a Node version outside `engines` (Node 26, D34).
engineStrict: true

# pnpm 12 fails installs when a dependency has an unapproved build script.
# true = may run its build script, false = never. Add entries as dependencies arrive.
allowBuilds:
  # Its postinstall only checks the platform binary and falls back to fetching @swc/wasm
  # with npm; the binary arrives as an optional dependency anyway.
  "@swc/core": false
  # No install script since Electron 45; scripts/ensure-electron.ts fetches the binary.
  electron: false
  electron-winstaller: false

catalog:
  "@fontsource-variable/inter": 5.3.0
  # Translation (ADR 0011). Every Lingui package moves together.
  "@lingui/cli": 6.12.0
  "@lingui/conf": 6.12.0
  "@lingui/core": 6.12.0
  "@lingui/format-po": 6.12.0
  "@lingui/react": 6.12.0
  "@lingui/vite-plugin": 6.12.0
  # Parses ICU in the catalog check (scripts/check-i18n.ts). The version Lingui itself uses.
  "@messageformat/parser": 5.2.0
  "@mantine/core": 9.7.5
  "@mantine/hooks": 9.7.5
  # The JS plugin API of the Oxlint that vite-plus ships; move it with vite-plus.
  "@oxlint/plugins": 1.91.0
  # Only packages/icons may depend on it (#18).
  "@phosphor-icons/react": 2.1.10
  # dependency-cruiser's TypeScript parser (verify:boundaries): its tsc parser needs the
  # JS compiler API, which TypeScript 7 no longer has.
  "@swc/core": 1.16.22
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  # Pinned to the Node version inside Electron (45.x ships Node 24), so TypeScript
  # flags Node 26 APIs that the desktop main process does not have (D34).
  "@types/node": 24.19.2
  "@types/culori": 4.0.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  # Oklab mixing in the theme engine's core (ADR 0009).
  culori: 4.0.2
  # Module boundaries (ADR 0006), configured in .dependency-cruiser.ts.
  dependency-cruiser: 18.7.2
  electron: 45.2.3
  electron-builder: 26.18.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  # Vite+ replaces vite with its own core; every package that depends on vite gets it (D28).
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  # Checks stored Settings against their declared schema (ADR 0010).
  zod: 4.6.7

overrides:
  "@types/node": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"

# Unmet peers fail resolution, so a pin outside a peer range shows up when the
# lockfile changes instead of scrolling past as a warning.
strictPeerDependencies: true

# Vite+ aliases vite to vite-plus-core@1.5.0, so peers like "vite ^8" see 1.5.0
# (vite-plus issue #2806). Same rule as t3code.
peerDependencyRules:
  allowedVersions:
    vite: "*"
