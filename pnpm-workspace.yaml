packages:
  - apps/*
  - packages/*

# No `engineStrict`: Dependabot runs pnpm on its own, older Node and could not update the
# lockfile. CI runs on the Node from `engines`.

# pnpm 12 fails installs when a dependency has an unapproved build script.
# true = may run its build script, false = never. Add entries as dependencies arrive.
allowBuilds:
  # Its postinstall only checks the platform binary and falls back to fetching @swc/wasm
  # with npm; the binary arrives as an optional dependency anyway.
  "@swc/core": false
  # No install script since Electron 45; scripts/ensure-electron.ts fetches the binary.
  electron: false
  electron-winstaller: false
  # Storybook's transitive bundler; its postinstall only double-checks the platform binary.
  esbuild: false

catalog:
  # Also a dev dependency of the root, so that every package resolves the peers of @lingui/react
  # and @lingui/core against this one version: with two, each package gets its own copy, and a
  # component reads a Lingui context that no provider fills (the start crashed on nightly).
  "@babel/core": 8.1.0
  "@rolldown/plugin-babel": 0.3.1
  babel-plugin-react-compiler: 1.0.0
  "@fontsource-variable/inter": 5.3.0
  # Translation (ADR 0011). Every Lingui package moves together.
  "@lingui/cli": 6.12.0
  "@lingui/conf": 6.12.0
  "@lingui/core": 6.12.0
  "@lingui/format-po": 6.12.0
  "@lingui/react": 6.12.0
  "@lingui/vite-plugin": 6.12.0
  # Parses ICU in the catalog check (scripts/check-i18n.ts). The version Lingui itself uses.
  "@messageformat/parser": 5.2.0
  "@mantine/core": 9.7.5
  "@mantine/hooks": 9.7.5
  "@mantine/modals": 9.7.5
  "@mantine/notifications": 9.7.5
  "@mantine/spotlight": 9.7.5
  # The JS plugin API of the Oxlint that vite-plus ships; move it with vite-plus.
  "@oxlint/plugins": 1.91.0
  # The transport between the renderer and the data process (D93): contracts, the
  # message-port server in the data process and the typed client. Every oRPC package moves together.
  "@orpc/client": 1.16.2
  "@orpc/contract": 1.16.2
  "@orpc/server": 1.16.2
  # Only packages/icons may depend on it (#18).
  "@phosphor-icons/react": 2.1.10
  # The Component Catalog (apps/component-catalog). Every Storybook package moves together.
  "@storybook/addon-vitest": 10.6.6
  "@storybook/react-vite": 10.6.6
  # dependency-cruiser's TypeScript parser (verify:boundaries): its tsc parser needs the
  # JS compiler API, which TypeScript 7 no longer has.
  "@swc/core": 1.16.22
  # Still beta, so pinned exactly (D179). Only packages/shell/src/shortcut-bindings.tsx imports it.
  "@tanstack/react-hotkeys": 0.22.3
  # The query cache of the page (D249). Only packages/data-client/src/react/ imports it.
  "@tanstack/react-query": 5.107.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  # Pinned to the Node version inside Electron (45.x ships Node 24), so TypeScript
  # flags Node 26 APIs that the desktop main process does not have (D34).
  "@types/node": 24.19.2
  "@types/better-sqlite3": 9.6.0
  "@types/culori": 4.0.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  # Renders the stories in Chromium (the `stories` stage). Move it with vite-plus.
  "@vitest/browser-playwright": 5.1.0
  # N-API, so one binary serves Node and Electron (D33).
  better-sqlite3: 13.0.3
  # Oklab mixing in the theme engine's core (ADR 0009).
  culori: 4.0.2
  # Module boundaries (ADR 0006), configured in .dependency-cruiser.ts.
  dependency-cruiser: 18.7.2
  electron: 45.2.3
  electron-builder: 26.18.0
  # A DOM for the hook tests of packages/data-client/src/react/, which run in Node.
  happy-dom: 21.0.4
  # The query layer and the migration runner (D91).
  kysely: 0.29.8
  # Its version pins the Chromium revision, so a bump downloads the browser again.
  playwright: 1.65.0
  react: 19.3.1
  react-dom: 19.3.1
  storybook: 10.6.6
  typescript: 7.0.2
  # Every record's id: a time-ordered UUIDv7 (D141).
  uuid: 14.0.3
  # Vite+ replaces vite with its own core; every package that depends on vite gets it (D28).
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  # Checks stored Settings against their declared schema (ADR 0010).
  zod: 4.6.7
  fast-check: 4.10.2

overrides:
  "@types/node": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"

# Unmet peers fail resolution, so a pin outside a peer range shows up when the
# lockfile changes instead of scrolling past as a warning.
strictPeerDependencies: true

# Vite+ aliases vite to vite-plus-core@1.5.0, so peers like "vite ^8" see 1.5.0
# (vite-plus issue #2806). Same rule as t3code.
peerDependencyRules:
  allowedVersions:
    vite: "*"
