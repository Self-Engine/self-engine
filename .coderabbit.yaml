# CodeRabbit reviews a pull request on its own only when it carries `size:XXL`, which
# .github/workflows/pr-size.yml sets (docs/agents/workflow.md, "Large pull requests"). Any other
# pull request gets a review on request: comment `@coderabbitai review`. Everything not set here
# comes from the settings in CodeRabbit's web interface.
inheritance: true
reviews:
  auto_review:
    enabled: false
    labels:
      - "size:XXL"
