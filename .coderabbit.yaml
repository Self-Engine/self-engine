# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Everything not set here comes from the settings in CodeRabbit's web interface.
inheritance: true
reviews:
  # A review runs on request only: comment `@coderabbitai review`. A large pull request needs
  # one before the merge (docs/agents/workflow.md, "Large pull requests").
  auto_review:
    enabled: false
  # CodeRabbit skips a pull request with more than 100 files, counted after these filters. Left
  # out is what `pnpm verify` checks by itself and a review adds little to: the lock file, the
  # extracted translation catalogs and the package manifests. Also left out: the documents, which
  # the owner reads and no stage checks beyond an ADR's name and front matter. Tests, stories and
  # the fixtures they use stay in the review, also when a pull request goes over the limit with
  # them.
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!packages/i18n/src/locales/*.po"
    - "!**/package.json"
    - "!**/tsconfig*.json"
    - "!docs/**"
    - "!GLOSSARY.md"
